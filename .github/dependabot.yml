# Managed by lis-github-monitor from config/dependabot/node.yml in DEFRA/lis-github-monitor.
# Edit the template there; changes here are overwritten.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: Europe/London
    commit-message:
      prefix: 'LREG-XXX:'
    versioning-strategy: increase
    allow:
      - dependency-type: direct
    cooldown:
      default-days: 3
      # Our own packages are released and consumed the same day.
      exclude:
        - '@defra/lis-*'
    groups:
      # One pull request for every @defra/lis-* bump, whatever the size.
      lis:
        patterns:
          - '@defra/lis-*'
      # One pull request for every other patch and minor bump.
      dependencies:
        exclude-patterns:
          - '@defra/lis-*'
        update-types:
          - minor
          - patch
      # Major bumps of a family arrive together; other majors come singly.
      vitest-major:
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
      eslint-major:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: Europe/London
    commit-message:
      prefix: 'LREG-XXX:'
    cooldown:
      default-days: 3
      # Our own workflows are released and consumed the same day.
      exclude:
        - DEFRA/lis-github-actions/*
    groups:
      # One pull request for every DEFRA/lis-github-actions workflow bump.
      lis-github-actions:
        patterns:
          - DEFRA/lis-github-actions/*
